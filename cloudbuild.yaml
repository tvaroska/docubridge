# Google Cloud Build pipeline for A2A Document Bridge (docubridge)
#
# Executes a maximally parallel DAG on E2_HIGHCPU_8:
#   - Track A (t=0): resolve-git-metadata -> docker-build-image (BuildKit layer cache)
#   - Track B (t=0): python-env-and-lint (uv + ruff check + ruff format --check)
#                    -> parallel python-core-and-enterprise-tests + python-agent-and-golden-tests
#                    -> python-coverage-gate (combines shards, enforces >=90% coverage)
#   - Track C (t=0): frontend-tests-and-typecheck (all 5 pnpm workspaces: vitest + tsc/vite build)
#   - Track D (t=0): terraform-plan-tests (13 credential-free .tftest.hcl suites)
#   - Fan-in Gate  : docker-push-image pushes to Artifact Registry ONLY after all tracks pass.
#
# Usage:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions "_IMAGE=us-central1-docker.pkg.dev/${PROJECT_ID}/bridge/bridge-runtime:latest"

substitutions:
  _REGION: us-central1
  _AR_REPO: bridge
  _SERVICE_NAME: docubridge-showcase-bridge
  _IMAGE: ""

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # ------------------------------------------------------------------------- #
  # 1. Resolve Git commit metadata (t=0, works for triggers & manual submit)  #
  # ------------------------------------------------------------------------- #
  - id: resolve-git-metadata
    name: gcr.io/cloud-builders/git
    waitFor: ["-"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ -n "${COMMIT_SHA}" ]; then
          SHA="${COMMIT_SHA}"
        else
          SHA="$$(git rev-parse --short=12 HEAD 2>/dev/null || echo 'local')"
        fi
        if [ -n "${BRANCH_NAME}" ]; then
          BRANCH="${BRANCH_NAME}"
        else
          BRANCH="$$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo 'main')"
        fi
        printf '%s' "$${SHA}" > /workspace/.resolved_sha
        printf "Resolved commit=%s branch=%s\n" "$${SHA}" "$${BRANCH}"

  # ------------------------------------------------------------------------- #
  # 2a. Sync Python Virtualenv + Ruff Lint & Format Check (t=0)               #
  # ------------------------------------------------------------------------- #
  - id: python-env-and-lint
    name: ghcr.io/astral-sh/uv:0.6-python3.12-bookworm-slim
    waitFor: ["-"]
    entrypoint: bash
    env:
      - UV_COMPILE_BYTECODE=1
      - UV_LINK_MODE=copy
      - UV_PROJECT_ENVIRONMENT=/workspace/.venv
    args:
      - -c
      - |
        set -euo pipefail
        uv sync --frozen --extra dev --extra gcp --no-install-project
        uv pip install "pytest-cov==7.0.0" "pytest-xdist==3.8.0"
        /workspace/.venv/bin/ruff check .
        /workspace/.venv/bin/ruff format --check .

  # ------------------------------------------------------------------------- #
  # 2b. Python Core, Port, Isolation & Enterprise Data Suite (Shard 1)        #
  # ------------------------------------------------------------------------- #
  - id: python-core-and-enterprise-tests
    name: ghcr.io/astral-sh/uv:0.6-python3.12-bookworm-slim
    waitFor: ["python-env-and-lint"]
    entrypoint: bash
    env:
      - COVERAGE_FILE=/workspace/.coverage.core
    args:
      - -c
      - |
        set -euo pipefail
        /workspace/.venv/bin/pytest tests/ \
          --ignore=tests/corpus_and_skills \
          --ignore=tests/conformance \
          --ignore=tests/perf \
          -n 4 --dist loadfile \
          --cov=bridge --cov=contract --cov-report= --cov-fail-under=0 \
          -q

  # ------------------------------------------------------------------------- #
  # 2c. Python Multi-Agent ADK/A2A Golden, Conformance & Perf Suite (Shard 2) #
  # ------------------------------------------------------------------------- #
  - id: python-agent-and-golden-tests
    name: ghcr.io/astral-sh/uv:0.6-python3.12-bookworm-slim
    waitFor: ["python-env-and-lint"]
    entrypoint: bash
    env:
      - COVERAGE_FILE=/workspace/.coverage.agents
    args:
      - -c
      - |
        set -euo pipefail
        /workspace/.venv/bin/pytest \
          tests/corpus_and_skills \
          tests/conformance \
          tests/perf \
          -n 4 --dist loadfile \
          --cov=bridge --cov=contract --cov-report= --cov-fail-under=0 \
          -q

  # ------------------------------------------------------------------------- #
  # 2d. Combine Coverage Shards & Enforce >=90% Coverage Gate                 #
  # ------------------------------------------------------------------------- #
  - id: python-coverage-gate
    name: ghcr.io/astral-sh/uv:0.6-python3.12-bookworm-slim
    waitFor:
      - python-core-and-enterprise-tests
      - python-agent-and-golden-tests
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        /workspace/.venv/bin/coverage combine /workspace/.coverage.core /workspace/.coverage.agents
        /workspace/.venv/bin/coverage report --fail-under=90

  # ------------------------------------------------------------------------- #
  # 3. Frontend All-Workspace Unit Tests, Typecheck & E2E Smoke Validation    #
  # ------------------------------------------------------------------------- #
  - id: frontend-tests-and-typecheck
    name: node:22-slim
    waitFor: ["-"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        corepack enable
        pnpm install --frozen-lockfile
        pnpm --filter "!@docubridge/e2e" -r --parallel test
        pnpm --filter @docubridge/shared build
        pnpm --filter "!@docubridge/e2e" --filter "!@docubridge/shared" -r --parallel build
        pnpm --filter @docubridge/e2e exec playwright test --list

  # ------------------------------------------------------------------------- #
  # 4. Infrastructure-as-Code Plan-Time Verification (t=0, terraform test)    #
  # ------------------------------------------------------------------------- #
  - id: terraform-plan-tests
    name: hashicorp/terraform:1.9
    waitFor: ["-"]
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        terraform -chdir=terraform init -backend=false -input=false
        terraform -chdir=terraform test

  # ------------------------------------------------------------------------- #
  # 5a. Build Production Runtime Image Concurrently with Test Tracks          #
  # ------------------------------------------------------------------------- #
  - id: docker-build-image
    name: gcr.io/cloud-builders/docker
    waitFor: ["resolve-git-metadata"]
    entrypoint: bash
    env:
      - DOCKER_BUILDKIT=1
    args:
      - -c
      - |
        set -euo pipefail
        SHA="$$(cat /workspace/.resolved_sha)"
        if [ -n "${_IMAGE}" ]; then
          TARGET_IMAGE="${_IMAGE}"
        else
          TARGET_IMAGE="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:$${SHA}"
        fi
        LATEST_IMAGE="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:latest"
        docker pull "$${LATEST_IMAGE}" || true
        docker build \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --cache-from "$${LATEST_IMAGE}" \
          -t "$${TARGET_IMAGE}" \
          -t "$${LATEST_IMAGE}" \
          -f Dockerfile \
          .

  # ------------------------------------------------------------------------- #
  # 5b. Push Production Runtime Image (Gated on All Verification Tracks)      #
  # ------------------------------------------------------------------------- #
  - id: docker-push-image
    name: gcr.io/cloud-builders/docker
    waitFor:
      - docker-build-image
      - python-coverage-gate
      - frontend-tests-and-typecheck
      - terraform-plan-tests
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        SHA="$$(cat /workspace/.resolved_sha)"
        if [ -n "${_IMAGE}" ]; then
          TARGET_IMAGE="${_IMAGE}"
        else
          TARGET_IMAGE="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:$${SHA}"
        fi
        LATEST_IMAGE="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:latest"
        docker push "$${TARGET_IMAGE}"
        docker push "$${LATEST_IMAGE}"
