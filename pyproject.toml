[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "docubridge"
version = "1.17.0"
description = "One document service for many agents: it chases missing files, rejects wrong documents, and resolves conflicting versions in code with an audit log, while callers own policy."
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.7",
    "google-adk[a2a]>=2.11.0,<3",
    # a2a-sdk http-server extra pulls sse-starlette + starlette for A2AStarletteApplication (SSE).
    # google-adk[a2a] pulls a2a-sdk but not its http-server extra.
    "a2a-sdk[http-server]>=1.1,<2",
    "fastapi>=0.115",
    "httpx>=0.27",
    "opentelemetry-api>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    "opentelemetry-sdk>=1.25",
    "uvicorn>=0.30",
    # Durable stores (P4-1, DUR-1/DUR-2): DatabaseSessionService (google-adk[db]) +
    # DatabaseTaskStore (a2a-sdk[sql]) over local sqlite. sqlalchemy[asyncio] pulls greenlet;
    # aiosqlite pinned explicitly (was only transitive). Postgres/Cloud-SQL extras are P7.
    "sqlalchemy[asyncio]>=2,<3",
    "aiosqlite>=0.20",
    # P5-1 (PROA-1): bridge/sla.py parses policy.yaml at runtime (not just dev).
    "pyyaml>=6",
]

[project.scripts]
# Cloud Run container entrypoint (P7-9): binds 0.0.0.0:$PORT via serve_container().
# The image's CMD is ["bridge-serve"]. Distinct from serve() (loopback, S0-sec-3).
bridge-serve = "bridge.edge.server:serve_container"

[project.optional-dependencies]
# Runtime deps are added per-phase as tasks introduce them
# (google-adk, a2a-sdk, fastapi, sqlalchemy+aiosqlite, ...).
dev = [
    "ast-grep-cli>=0.35",
    "mypy>=1.14",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
    "pyyaml",
    "ruff>=0.16,<0.17",
    "sqlglot>=25.0.0",
    "types-PyYAML>=6.0",
]
# GCP port runtime deps, installed by the P7-9 provisioned run (BRIDGE_TEST_GCP=1):
#   - asyncpg: the async Postgres driver for the Cloud SQL shared-store adapters
#     (P7-2), imported transitively via create_async_engine("postgresql+asyncpg://…").
#   - google-cloud-storage: the GCS client for the skill_registry adapter,
#     GcsArtifactService, and the signed-URL signer (P7-3).
#   - google-cloud-tasks: the Cloud Tasks client for the scheduler adapter (P7-4),
#     imported lazily to mint the OIDC-authenticated follow-up Cloud Task.
#   - google-cloud-documentai: the Document AI client for the docai extraction
#     engine's OCR pre-pass (the client's processor, BRIDGE_DOCAI_PROCESSOR).
# All are imported lazily INSIDE methods (never at module import), so the default
# (non-gcp) test suite runs without any of them installed.
gcp = [
    "asyncpg>=0.29",
    "google-cloud-aiplatform[agent-engines]>=1.148.1,<2",
    "google-cloud-documentai>=3.0",
    "google-cloud-storage>=2.18",
    "google-cloud-tasks>=2.16",
    # Soft-imported at runtime alongside optional opentelemetry-instrumentation-google-genai
    # so offline unit tests run cleanly without network or GCE metadata server.
    "opentelemetry-resourcedetector-gcp>=1.14",
]

[tool.ruff]
# Python 3.12 target; line width 88 (ruff/black default). `ruff format` owns line
# width — E501 is intentionally NOT in the lint select (see [tool.ruff.lint]), so the
# linter flags correctness/imports/modernization while the formatter handles wrapping.
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# Full standards baseline: pycodestyle (E/W, E501 owned by ruff format), pyflakes (F),
# isort (I), bugbear (B), comprehensions (C4), pyupgrade (UP), bandit (S), blind-except
# (BLE), annotations (ANN), ruff-native (RUF), McCabe complexity (C90), and pylint
# structural caps (PLR0911/PLR0912/PLR0913/PLR0915).
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "S",
    "BLE",
    "ANN",
    "RUF",
    "C90",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
]
ignore = [
    # ruff format owns line wrapping.
    "E501",
    # str+Enum → enum.StrEnum: changes __str__/wire-string behavior of the shared
    # contract/ enums (StrEnum stringifies to the value, (str, Enum) to "Cls.name").
    # Out of scope for lint config — do not touch wire semantics here.
    "UP042",
    # Ambiguous-unicode in docstrings: the → / ≤ / § characters are intentional domain
    # notation (arrows, "≤ 3", spec section marks), not typos.
    "RUF002",
]

[tool.ruff.lint.isort]
# First-party packages in docubridge core, plus the test root.
known-first-party = ["contract", "bridge", "skills", "tests"]

[tool.ruff.lint.per-file-ignores]
# Package re-exports: names imported for the public surface, not used in-module.
"**/__init__.py" = ["F401"]
# Test fixtures, fake doubles, parametrized tests, and recording scripts stay pragmatic.
"tests/**" = [
    "ANN",
    "S101",
    "S105",
    "S106",
    "S108",
    "C901",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
]
"**/tests/**" = [
    "ANN",
    "S101",
    "S105",
    "S106",
    "S108",
    "C901",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
]
"demo/**" = ["ANN"]
"**/demo/**" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
exclude = ["^\\.venv/", "^frontend/"]

[[tool.mypy.overrides]]
module = [
    "asyncpg",
    "asyncpg.*",
    "google.api_core.*",
    "google.auth.*",
    "google.cloud.*",
    "google.oauth2.*",
    "google.protobuf.*",
    "opentelemetry.instrumentation.*",
    "opentelemetry.resourcedetector.*",
    "vertexai",
    "vertexai.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "port: shared port-parity tests parametrized over local/gcp adapters (Hexagonal Ports & Adapters)",
]
filterwarnings = [
    "ignore:.*EXPERIMENTAL.*:UserWarning",
    "ignore:label\\(\\) is deprecated.*:DeprecationWarning",
    "ignore:Exception ignored in.*ActiveTask\\._run_:pytest.PytestUnraisableExceptionWarning",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["bridge", "contract"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.hatch.build.targets.wheel]
packages = ["contract", "bridge"]

[tool.uv]
package = false
required-version = ">=0.12.24"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
